<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Trading Dashboard</title><style>body{margin:0;background:linear-gradient(135deg,#667eea,#5a4bb6);font-family:Arial}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border-radius:24px;padding:25px;margin:18px 0}.label{color:#5870df;font-size:20px;font-weight:bold}.value{font-size:44px;font-weight:bold;margin:12px 0}.buttons{display:flex;gap:10px}.buttons button{flex:1;border:0;border-radius:22px;padding:18px;color:#fff;font-weight:bold;font-size:17px}.start{background:#673ab7}.stop{background:#ed363d}.refresh{background:#0caf7b}@media(max-width:600px){.value{font-size:34px}}</style></head><body><div class="wrap"><h1 style="color:white;text-align:center">Paper Trading Dashboard</h1><div class="card"><div class="label">CURRENT BALANCE</div><div class="value" id="balance">$800.00</div><small>Initial: $800 | Paper only</small></div><div class="card"><div class="label">TOTAL TRADES</div><div class="value" id="trades">0</div><small>Win Rate: <span id="win">0</span>%</small></div><div class="card"><div class="label">TOTAL P&amp;L</div><div class="value" id="pnl">$0.00</div><small>Risk/Reward: 3:1</small></div><div class="card"><div class="label">OPEN POSITIONS</div><div class="value" id="open">0</div><small>Maximum: 5</small></div><div class="buttons"><button class="start" onclick="action('/api/trading/start')">▶ START</button><button class="stop" onclick="action('/api/trading/stop')">■ STOP</button><button class="refresh" onclick="refresh()">↻ REFRESH</button></div></div><script>async function refresh(){const s=await fetch('/api/stats').then(r=>r.json());balance.textContent='$'+Number(s.balance).toFixed(2);trades.textContent=s.total_trades;win.textContent=Number(s.win_rate).toFixed(2);pnl.textContent='$'+Number(s.total_profit).toFixed(2);open.textContent=s.open_positions}async function action(url){await fetch(url,{method:'POST'});refresh()}refresh();setInterval(refresh,5000)</script></body></html>
